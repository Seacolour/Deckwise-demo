syntax = "proto3";

package paperpuppy.backendintl.agent.tool;

option java_multiple_files = true;
option java_package = "com.xiaoyuan.paperpuppybackendintl.grpc.agent.tool";
option java_outer_classname = "AgentToolFileProto";

// 项目文件、内容读取、图片搜索与临时访问 URL 协议。

message ListProjectFilesRequest {
  int64 user_id = 1;
  int64 project_id = 2;
}

message ListProjectFilesResponse {
  repeated FileItem files = 1;
}

message FileItem {
  int64 file_id = 1;
  string file_name = 2;
  string file_type = 3;  // pdf, docx, etc.
  int64 size_bytes = 4;
  string created_at = 5;
  // 可选：若该文件有可编辑文档副本，则返回 document_id
  int64 document_id = 6;
  // 可选：预览图 URL
  string preview_url = 7;
  string summary = 8;
  int32 document_version = 9;  // documents.version
  int32 summary_version = 10;  // documents.summary_version
  string document_type = 11;   // markdown for editable documents
  int64 estimated_model_chars = 12; // canonical/structured model JSON char hint, if available
  int32 page_count = 13;            // reserved legacy scale hint
  int64 estimated_text_chars = 14;  // editable text char hint, if available
}

// ======== GetDocument（Markdown 文档）========

message GetDocumentRequest {
  int64 user_id = 1;
  int64 project_id = 2;
  int64 document_id = 3;
  bool read_draft = 4;  // true=读取草稿, false=读取已发布版本
}

message GetDocumentResponse {
  int64 document_id = 1;
  string title = 2;
  string content = 3;           // 脱敏：仅返回文本内容
  int32 version = 4;            // 乐观锁版本号（用于后续 update）
  string updated_at = 5;
  // 不返回：project_id, created_by, file_url 等敏感信息
}

// ======== GetFileContent（PDF 等文件切片）========

message GetFileContentRequest {
  int64 user_id = 1;
  int64 project_id = 2;
  int64 file_id = 3;
  int32 max_fragments = 4;  // 最大返回切片数（默认 5，最大 50）
  // 起始切片（1-based）。例如 start_fragment=11 表示从第 11 块开始读取。
  // 说明：DB 内 fragment_index 为 0-based；此处对外统一使用 1-based 方便理解。
  int32 start_fragment = 5;
}

message GetFileContentResponse {
  int64 file_id = 1;
  string file_name = 2;
  string file_type = 3;
  string content = 4;           // 拼接后的文本内容
  int32 total_fragments = 5;    // 文件总切片数
  int32 returned_fragments = 6; // 本次返回的切片数
  // 不返回：file_url, object_key 等敏感信息
}

// ======== GetImage（图片 URL）========

message GetImageRequest {
  int64 user_id = 1;
  int64 project_id = 2;
  int64 file_id = 3;
}

message GetImageResponse {
  int64 file_id = 1;
  string file_name = 2;
  string file_type = 3;
  string image_url = 4;
}

message GetFileUrlRequest {
  int64 user_id = 1;
  int64 project_id = 2;
  int64 file_id = 3;
}

message GetFileUrlResponse {
  int64 file_id = 1;
  string file_name = 2;
  string file_type = 3;   // pdf, docx, txt, etc.
  string file_url = 4;    // AI 可访问的 URL，供 OpenAI input_file 使用
  int64 size_bytes = 5;
}
